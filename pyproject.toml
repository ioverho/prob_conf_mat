[project]
name = "prob-conf-mat"
authors = [{ name = "Ivo Verhoeven", email = "mail@ivoverhoeven.nl" }]
description = "Confusion matrices with uncertainty quantification, experiment aggregation and significance testing."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
license = { file = "LICENSE" }
keywords = [
    "confusion matrices",
    "classification",
    "confusion matrix",
    "statistics",
    "probabilistic",
]

dynamic = ["version"]

dependencies = [
    "numpy",
    "scipy>=1.10",
    "tabulate>=0.9",
    "matplotlib>=3.7",
    "jaxtyping>=0.2.32",
]

[project.urls]
Homepage = "https://pcm.ivoverhoeven.nl/"
Documentation = "https://pcm.ivoverhoeven.nl/"
Repository = "https://github.com/ioverho/prob_conf_mat"
Issues = "https://github.com/ioverho/prob_conf_mat/issues"

[build-system]
requires = ["hatchling", "numpy>=2.0.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.38.1",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "opt-einsum>=3.4.0",
    "pandas>=2.3.3",
    "pip>=25.3",
    "prek>=0.3.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.10",
    "scalene>=2.0.1",
    "scikit-learn>=1.9.0",
    "snakeviz>=2.2.2",
    "toml>=0.10.2",
]

docs = [
    "griffe-inherited-docstrings>=1.1.3",
    "mkdocstrings[python]>=1.0.3",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "zensical>=0.0.50",
]

# Building
# Hatch
[tool.hatch.version]
source = "uv-dynamic-versioning"

# UV
[tool.uv]
# For security, prevent packages that are too 'bleeding edge'
# https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
exclude-newer = "1 week"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

# Linting
# Ruff
[tool.ruff]
extend-exclude = [
    'tests/*',
    '**/mkdocs.py',
    '**/*ignore*/*',
    'docs/**/*.ipynb',
    "**/__init__.py",
]
builtins = ["jtyping"]

line-length = 88
indent-width = 4
respect-gitignore = true

[tool.ruff.lint]
ignore = [
    "C408",    # Unnecessary collection call
    "COM812",  # Missing trailing comma, should not be used with formatter
    "D100",    # Undocumented public module
    "D104",    # Undocumented public package
    "D105",    # Undocumented magic method
    "D107",    # Undocumented __init__ method
    "F722",    # Forward annotation error. Conflicts with jaxtyping
    "ICN001",  # Matplotlib should be imported as MPL
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
    "RET504",  # Unnecessary assign
    "SIM910",  # dict.get with None default
    "TD002",   # Missing TODO author
    "TD003",   # Missing TODO link
    "UP037",   # Removes quotes in type annotations
    "W505",    # Docstring too long
    "TRY003",
    "SIM118",
    "PD011",
    "ARG002",
    "RUF002",
    "G004",
    "UP034", # Unnecessary parentheses
]

extend-select = [
    "A",    # Shadowed builtins
    "ARG",  # Unused arguments
    "B",    # Bugbear
    "BLE",  # Disallow catch-all exceptions
    "C4",   # Catch incorrect use of comprehensions, dict, list, etc
    "COM",  # Enforce trailing comma rules
    "D",    # PyDocStyle
    "DTZ",  # flake8-datetimez
    "E",    # PyCodeStyle errors
    "EXE",  # flake8-executable
    "F",    # Pyflakes rules
    "FA",   # Enforce from __future__ import annotations
    "FBT",  # Boolean traps
    "FLY",  # Flynt rules
    "FURB", # Refurb rules
    "G",    # Flake8-logging-format
    "I",    # Isort
    "ICN",  # Use common import conventions
    "ISC",  # Good use of string concatenation
    "LOG",  # flake8-logging
    "N",    # Naming conventions
    "NPY",  # NumPy specific rules
    "NPY",  # Some numpy-specific things
    "PD",   # Pandas rules
    "PERF", # Performance rules
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # Use pathlib instead of os.path
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RET",  # Good return practices
    "RSE",  # flake8-raise
    "RUF",  # Ruff-specific
    "S",    # Security
    "SIM",  # Common simplification rules
    "SLOT", # flake8-slots
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TC",   # Enforce importing certain types in a TYPE_CHECKING block
    "TD",   # Be diligent with TODO comments
    "TID",  # Some good import practices
    "TRY",  # Tryceratops
    "UP",   # Warn if certain things can changed due to newer Python versions
    "W",    # PyCodeStyle warnings
    "YTT",  # flake8-2020
]

[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (import violations) and `F403` (undefined names) in all `__init__.py` files
"__init__.py" = ["F401", "F403"]
# Ignore documentationin tests
"tests/*" = ["D"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 100
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# Typechecking
# Pyright
[tool.pyright]
include = ["src"]
exclude = [
    '**/node_modules',
    '**/__pycache__',
    '**/.*',
    '**/tests*',
    '**/dev*',
    '**/klad*',
    '**/__init__.py',
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
pythonPlatform = "Linux"

# Based Pyright
analyzeUnannotatedFunctions = false
reportAny = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = false
reportImplicitOverride = false
reportUnusedCallResult = false
reportPrivateLocalImportUsage = false
reportUnknownParameterType = false

# Testing
# PyTest
[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
strict = true
log_level = "INFO"
testpaths = ["tests"]

# Coverage
[tool.coverage]
[tool.coverage.run]
omit = ["tests/*.py"]

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'raise AssertionError',
    'raise NotImplementedError',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

format = "markdown"

ignore_errors = true

precision = 2

sort = "cover"

[tool.coverage.html]
directory = "./tests/logs/coverage"
